# Allowed module dependencies and imports.
# Read by the layer-2 import check. Protected by CODEOWNERS.
# Module names match Modules/Package.swift. Agree your own with the user (skills/new-project step 2).

modules:
  Domain:
    may_depend_on: []
    may_import_system: [Foundation]
  Data:
    may_depend_on: [Domain]
    may_import_system: [Foundation]
  Features:
    may_depend_on: [Domain]
    may_import_system: [Foundation, SwiftUI, Observation]
  App:  # app target (not yet in the template): the composition root, the only place dependencies are wired together
    may_depend_on: [Domain, Data, Features]
    may_import_system: [Foundation, SwiftUI]

# Import statements are checked too, not just declared dependencies:
# Swift accepts indirect imports and any system framework, and accepts undeclared
# sibling imports on incremental builds. See rules/module-boundaries.
