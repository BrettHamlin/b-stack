org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# No build cache: a gate must check this code with these rules, never reuse an earlier result.
org.gradle.caching=false
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
bstack.applicationId=dev.bstack.starter
# The shipped app's version: raise versionCode for every upload to Play (scripts/package.py can override both).
bstack.versionCode=1
bstack.versionName=0.1.0
# Every SDK package comes from tools.toml's pins (scripts/tools.py), never a download by the build.
android.builder.sdkDownload=false
org.gradle.problems.report=false
