      - value: 'java.lang.Thread.<init>'
        reason: '[no-concurrency-escapes] a Thread outlives everything and can''t be cancelled. Launch in the scope you were given.'
      - value: 'kotlin.concurrent.thread'
        reason: '[no-concurrency-escapes] a thread outlives everything and can''t be cancelled. Launch in the scope you were given.'
      - value: 'kotlin.synchronized'
        reason: '[no-concurrency-escapes] synchronized blocks a thread. Share state through one owner or a Mutex.'
      - value: 'kotlinx.coroutines.newSingleThreadContext'
        reason: '[no-concurrency-escapes] a new thread pool nobody closes. Use the dispatcher you were given.'
      - value: 'kotlinx.coroutines.newFixedThreadPoolContext'
        reason: '[no-concurrency-escapes] a new thread pool nobody closes. Use the dispatcher you were given.'
      - value: 'kotlin.properties.Delegates.notNull'
        reason: '[no-force-operations] Delegates.notNull() throws if read before it is set, like lateinit. Take the value in the constructor, or make it nullable.'
      - value: 'kotlinx.coroutines.runBlocking'
        reason: '[no-concurrency-escapes] runBlocking blocks the thread. Make the caller suspend, or launch in the scope you were given.'
      - value: 'java.lang.Thread.sleep'
        reason: '[retired-apis] Thread.sleep blocks the thread. Use delay() in a coroutine, which can be cancelled and tested on virtual time.'
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'kotlinx.coroutines.GlobalScope'
        reason: '[no-concurrency-escapes] GlobalScope work outlives everything. Launch in the scope you were given.'

bstack:
  NoForceCast:
    active: true
    excludes: ['**/commonTest/**', '**/src/test/**']
  NoThrow:
    active: true
    excludes: ['**/commonTest/**', '**/src/test/**', '**/verify/runner/**']
  NoPlatformTypeCall:
    active: true
    excludes: ['**/commonTest/**', '**/src/test/**']

console-reports:
  exclude: ['ProjectStatisticsReport', 'ComplexityReport', 'NotificationReport', 'FindingsReport']
