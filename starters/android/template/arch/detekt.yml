        reason: '[no-force-operations] toBooleanStrict() throws on anything but true or false. Use toBooleanStrictOrNull() and handle null.'
      - value: 'kotlin.collections.removeFirst'
        reason: '[no-force-operations] removeFirst() throws on an empty list. Use removeFirstOrNull() and handle null.'
      - value: 'kotlin.collections.removeLast'
        reason: '[no-force-operations] removeLast() throws on an empty list. Use removeLastOrNull() and handle null.'
      - value: 'kotlin.text.toUInt'
