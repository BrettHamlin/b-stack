      - value: 'kotlin.collections.min'
        reason: '[no-force-operations] min() throws on an empty collection. Use minOrNull() and handle null.'
      - value: 'kotlin.collections.maxBy'
        reason: '[no-force-operations] maxBy() throws on an empty collection. Use maxByOrNull() and handle null.'
      - value: 'kotlin.collections.minBy'
        reason: '[no-force-operations] minBy() throws on an empty collection. Use minByOrNull() and handle null.'
      - value: 'kotlin.collections.maxOf'
        reason: '[no-force-operations] maxOf() throws on an empty collection. Use maxOfOrNull() and handle null.'
      - value: 'kotlin.collections.minOf'
        reason: '[no-force-operations] minOf() throws on an empty collection. Use minOfOrNull() and handle null.'
      - value: 'kotlin.collections.elementAt'
        reason: '[no-force-operations] elementAt() throws on an empty collection. Use elementAtOrNull() and handle null.'
      - value: 'kotlin.collections.random'
        reason: '[no-force-operations] random() throws on an empty collection. Use randomOrNull() and handle null.'
      - value: 'kotlin.sequences.reduce'
        reason: '[no-force-operations] reduce() throws on an empty collection. Use reduceOrNull() and handle null.'
      - value: 'kotlin.sequences.max'
        reason: '[no-force-operations] max() throws on an empty collection. Use maxOrNull() and handle null.'
      - value: 'kotlin.sequences.min'
        reason: '[no-force-operations] min() throws on an empty collection. Use minOrNull() and handle null.'
      - value: 'kotlin.sequences.maxBy'
        reason: '[no-force-operations] maxBy() throws on an empty collection. Use maxByOrNull() and handle null.'
      - value: 'kotlin.sequences.minBy'
        reason: '[no-force-operations] minBy() throws on an empty collection. Use minByOrNull() and handle null.'
      - value: 'kotlin.sequences.maxOf'
        reason: '[no-force-operations] maxOf() throws on an empty collection. Use maxOfOrNull() and handle null.'
      - value: 'kotlin.sequences.minOf'
        reason: '[no-force-operations] minOf() throws on an empty collection. Use minOfOrNull() and handle null.'
      - value: 'kotlin.sequences.elementAt'
        reason: '[no-force-operations] elementAt() throws on an empty collection. Use elementAtOrNull() and handle null.'
      - value: 'kotlin.text.random'
        reason: '[no-force-operations] random() throws on empty text. Use randomOrNull() and handle null.'
      - value: 'kotlin.ranges.random'
        reason: '[no-force-operations] random() throws on an empty range. Use randomOrNull() and handle null.'
      - value: 'kotlin.text.reduce'
        reason: '[no-force-operations] reduce() throws on empty text. Use reduceOrNull() and handle null.'
      - value: 'kotlin.text.max'
        reason: '[no-force-operations] max() throws on empty text. Use maxOrNull() and handle null.'
      - value: 'kotlin.text.min'
        reason: '[no-force-operations] min() throws on empty text. Use minOrNull() and handle null.'
      - value: 'kotlin.text.maxBy'
