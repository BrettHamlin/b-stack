# detekt 2.0.0-alpha.6, run with type resolution by scripts/check.py's detekt gate. Only the rules below run (the
# build doesn't build on detekt's defaults), each an error. bstack is our own rule set (arch/detekt-rules).
# Each `reason` starts with the b-stack rule it enforces, so the message says which rule fired and what to do.

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  LateinitUsage:
    active: true
    excludes: ['**/commonTest/**', '**/src/test/**']

exceptions:
  NotImplementedDeclaration:
    active: true
  # catch (e: Exception) also catches CancellationException, so a cancelled coroutine carries on (no-concurrency-escapes).
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: 'a^'
    excludes: ['**/commonTest/**', '**/src/test/**', '**/verify/runner/**']

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
    dispatcherNames: ['IO', 'Default', 'Unconfined', 'Main']
    # The composition roots are where dispatchers are chosen and passed in.
    excludes: ['**/app/src/**', '**/app-verify/src/**', '**/commonTest/**', '**/src/test/**', '**/verify/runner/**']
  SuspendFunSwallowedCancellation:
    active: true
  SleepInsteadOfDelay:
    active: true

style:
  ForbiddenMethodCall:
    active: true
    excludes: ['**/commonTest/**', '**/src/test/**', '**/verify/runner/**']
    methods:
      - value: 'kotlin.requireNotNull'
        reason: '[no-force-operations] requireNotNull throws on null, like !!. Handle the null (?., ?:, if/when), or model the value as non-null.'
      - value: 'kotlin.checkNotNull'
        reason: '[no-force-operations] checkNotNull throws on null, like !!. Handle the null (?., ?:, if/when), or model the value as non-null.'
      - value: 'kotlin.error'
        reason: '[no-force-operations] error() throws. Return a sealed result the caller must handle.'
      - value: 'kotlin.collections.first'
        reason: '[no-force-operations] first() throws when nothing matches. Use firstOrNull() and handle null.'
      - value: 'kotlin.sequences.first'
        reason: '[no-force-operations] first() throws when nothing matches. Use firstOrNull() and handle null.'
      - value: 'kotlin.text.first'
        reason: '[no-force-operations] first() throws when nothing matches. Use firstOrNull() and handle null.'
      - value: 'kotlin.collections.last'
        reason: '[no-force-operations] last() throws when nothing matches. Use lastOrNull() and handle null.'
      - value: 'kotlin.sequences.last'
        reason: '[no-force-operations] last() throws when nothing matches. Use lastOrNull() and handle null.'
      - value: 'kotlin.text.last'
        reason: '[no-force-operations] last() throws when nothing matches. Use lastOrNull() and handle null.'
      - value: 'kotlin.collections.single'
        reason: '[no-force-operations] single() throws unless exactly one matches. Use singleOrNull() and handle null.'
      - value: 'kotlin.sequences.single'
        reason: '[no-force-operations] single() throws unless exactly one matches. Use singleOrNull() and handle null.'
      - value: 'kotlin.text.single'
        reason: '[no-force-operations] single() throws unless exactly one matches. Use singleOrNull() and handle null.'
      - value: 'kotlin.require'
        reason: '[no-force-operations] require() throws. Return a sealed result the caller must handle, or make the type say it.'
      - value: 'kotlin.check'
        reason: '[no-force-operations] check() throws. Return a sealed result the caller must handle, or make the type say it.'
      - value: 'kotlin.collections.List.get'
        reason: '[no-force-operations] list.get(i) throws when i is out of range. Use getOrNull(i) and handle null.'
      - value: 'kotlin.Array.get'
        reason: '[no-force-operations] array.get(i) throws when i is out of range. Use getOrNull(i) and handle null.'
      - value: 'kotlin.collections.getValue'
        reason: '[no-force-operations] getValue throws on a missing key. Use get() and handle null.'
      - value: 'kotlin.text.toInt'
        reason: '[no-force-operations] toInt() throws on text that isn''t a number. Use toIntOrNull() and handle null.'
      - value: 'kotlin.text.toLong'
        reason: '[no-force-operations] toLong() throws on text that isn''t a number. Use toLongOrNull() and handle null.'
      - value: 'kotlin.text.toShort'
        reason: '[no-force-operations] toShort() throws on text that isn''t a number. Use toShortOrNull() and handle null.'
      - value: 'kotlin.text.toByte'
        reason: '[no-force-operations] toByte() throws on text that isn''t a number. Use toByteOrNull() and handle null.'
      - value: 'kotlin.text.toDouble'
        reason: '[no-force-operations] toDouble() throws on text that isn''t a number. Use toDoubleOrNull() and handle null.'
      - value: 'kotlin.text.toFloat'
        reason: '[no-force-operations] toFloat() throws on text that isn''t a number. Use toFloatOrNull() and handle null.'
      - value: 'kotlin.enumValueOf'
        reason: '[no-force-operations] enumValueOf throws on an unknown name. Use entries.firstOrNull { it.name == name } and handle null.'
      - value: 'kotlin.getOrThrow'
        reason: '[no-force-operations] getOrThrow() throws. Use getOrNull(), getOrElse or fold.'
      - value: 'kotlin.collections.reduce'
        reason: '[no-force-operations] reduce() throws on an empty collection. Use reduceOrNull() and handle null.'
      - value: 'kotlin.collections.max'
