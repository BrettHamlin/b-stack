# Runs every gate on each pull request and on main, then builds the release binary and proves it runs. Make `check` a required status check in branch protection, with
# "Require review from Code Owners" (CODEOWNERS covers this file).
#
# Linux: tools.toml pins cargo-deny for linux-x64 as well as mac-arm64. The runner's rustup installs the toolchain
# rust-toolchain.toml pins, into the cache folder.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Cache folder for tools and build output
        run: |
          mkdir -p "$RUNNER_TEMP/bstack-cache"
          echo "BSTACK_CACHE_DIR=$RUNNER_TEMP/bstack-cache" >> "$GITHUB_ENV"
      # First: its build is --locked, so it fails on a Cargo.lock the commit doesn't match, before check.py's cargo
      # commands could update it.
      - name: The release binary, checked, and its smoke run
        run: python3 scripts/package.py
      - name: Every gate (check.py), journeys against the debug and release builds
        run: python3 scripts/check.py
      - name: The binary and its checksum in one archive (an artifact's zip would drop the executable bit)
        run: tar -czf "$RUNNER_TEMP/release.tar.gz" -C .build/package/out .
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ runner.temp }}/release.tar.gz
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: evidence
          path: .build/evidence/
          if-no-files-found: ignore
