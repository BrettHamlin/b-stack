id = "tally"
summary = "Count named items; the tally is saved between runs, and a failed save keeps the old one."
modules = ["tally"]

[[journeys]]
name = "tally_is_saved_across_runs"
proves = "Adds count up and survive the app exiting; show lists every item."

[[journeys]]
name = "failed_save_keeps_the_old_tally"
proves = "When the data folder can't be written, add fails with a message and the saved tally is unchanged."

[[journeys]]
name = "bad_name_is_refused"
proves = "An invalid name is refused with the rule for names, and nothing is saved."
