# Protected (CODEOWNERS). Tests may unwrap and index: a failing test is the point.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Retired or banned APIs: calling one fails the clippy gate with this reason.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "Don't wait for time to pass. Wait for the event itself (a channel, a join handle), or take a clock as a dependency." },
]
