# b-stack's own checks. iOS cases need Xcode 27.2 and an iOS 27.2 simulator, which hosted runners don't have; run
# `python3 scripts/test_rules.py --platform ios` on a Mac that does before merging changes that touch iOS. Android runs
# on Linux, where the emulator gets KVM.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  repo:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Rule and case format, catalog, links
        run: python3 scripts/check_repo.py
      - name: Starter helper scripts
        run: python3 scripts/test_starter_scripts.py

  rust:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Cache folder for tools and build output
        run: |
          mkdir -p "$RUNNER_TEMP/bstack-cache"
          echo "BSTACK_CACHE_DIR=$RUNNER_TEMP/bstack-cache" >> "$GITHUB_ENV"
      - name: Every Rust rule case through the Rust starter's gates
        run: python3 scripts/test_rules.py --platform rust

  android:
    # Linux, not macOS: GitHub's Linux runners give the emulator KVM, and its macOS runners can't run it. The starter
    # pins an x86_64 system image and Linux tools for this (tools.toml, linux-x64).
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Cache folder for tools and build output (on /mnt, the runner's larger disk)
        run: |
          sudo mkdir -p /mnt/bstack-cache && sudo chown "$USER" /mnt/bstack-cache
          echo "BSTACK_CACHE_DIR=/mnt/bstack-cache" >> "$GITHUB_ENV"
      - name: Gradle's downloads from earlier runs (keyed by the pinned checksums)
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/bstack-cache/tools/gradle-home/caches/modules-2
          key: android-gradle-${{ hashFiles('starters/android/template/gradle/verification-metadata.xml') }}
      - name: Download every library, retried (Maven Central answers 429 to busy shared runners)
        working-directory: starters/android/template
        run: |
          for attempt in 1 2 3 4 5; do
            python3 scripts/check.py --only compiler --only detekt --only lint --only konsist --only deps && exit 0
            echo "attempt $attempt failed; retrying in $((attempt * 60)) s"; sleep $((attempt * 60))
          done
          exit 1
      - name: The starter's own gates (check.py), journeys and the shipped app's launch on the emulator
        working-directory: starters/android/template
        run: python3 scripts/check.py
      - name: Every Android rule case through the starter's gates
        run: python3 scripts/test_rules.py --platform android
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-evidence
          path: |
            starters/android/template/.build/evidence/
            starters/android/template/.build/emulator.log
          if-no-files-found: ignore

  typescript:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Cache folder for tools and build output
        run: |
          mkdir -p "$RUNNER_TEMP/bstack-cache"
          echo "BSTACK_CACHE_DIR=$RUNNER_TEMP/bstack-cache" >> "$GITHUB_ENV"
      - name: The starter's own CI (check.py with a frozen lockfile)
        working-directory: starters/typescript/template
        run: python3 scripts/check.py
      - name: Every TypeScript rule case through the starter's gates
        # Cases add packages, so pnpm must update the lockfile in their copies; with CI=true it refuses to.
        env:
          CI: "false"
        run: python3 scripts/test_rules.py --platform typescript
      - name: Throwaway Windows signing certificate (the Windows jobs trust it, to check the signatures)
        run: |
          cd "$RUNNER_TEMP"
          # A root (trusted on the Windows runners) and the code-signing certificate it issues, as a real publisher has.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout win-ca-key.pem -out win-ca.pem -days 2 -subj "/CN=b-stack CI root" \
            -addext "basicConstraints=critical,CA:true" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -keyout win-key.pem -out win.csr -subj "/CN=b-stack CI"
          printf 'basicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=codeSigning\n' > win-ext.cnf
          openssl x509 -req -in win.csr -CA win-ca.pem -CAkey win-ca-key.pem -CAcreateserial -days 1 -extfile win-ext.cnf -out win-cert.pem
          openssl pkcs12 -export -legacy -inkey win-key.pem -in win-cert.pem -certfile win-ca.pem -out win.pfx -passout pass:ci 2>/dev/null \
            || openssl pkcs12 -export -inkey win-key.pem -in win-cert.pem -certfile win-ca.pem -out win.pfx -passout pass:ci
          mkdir -p "$RUNNER_TEMP/release" && cp win-ca.pem win-cert.pem "$RUNNER_TEMP/release/"
          echo "WIN_CSC_LINK=$RUNNER_TEMP/win.pfx" >> "$GITHUB_ENV"
          echo "WIN_CSC_KEY_PASSWORD=ci" >> "$GITHUB_ENV"
          echo "BSTACK_UPDATE_URL=http://127.0.0.1:8765/" >> "$GITHUB_ENV"
      - name: Version 0.1.1 for Windows and Linux (x64), the update the 0.1.0 apps must find
        working-directory: starters/typescript/template
        run: |
          python3 scripts/package.py win-x64 linux-x64 --version 0.1.1 --no-journeys
          mkdir -p "$RUNNER_TEMP/release/update" && cp -R .build/package/out/update/. "$RUNNER_TEMP/release/update/"
      - name: Version 0.1.0 installers for every target; journeys on the Apple silicon app, smoke on its .dmg and on the Intel app (Rosetta)
        working-directory: starters/typescript/template
        run: |
          python3 scripts/package.py --all
          cp .build/package/out/*.exe .build/package/out/*.AppImage "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: typescript-installers
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typescript-evidence
          path: starters/typescript/template/.build/evidence/
          if-no-files-found: ignore

  typescript-signing:
    # A throwaway Developer ID-style certificate, trusted only on this runner, proves the signing path end to end:
    # electron-builder signs with the hardened runtime, codesign verifies it, and the journeys pass on the signed app.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Cache folder for tools and build output
        run: |
          mkdir -p "$RUNNER_TEMP/bstack-cache"
          echo "BSTACK_CACHE_DIR=$RUNNER_TEMP/bstack-cache" >> "$GITHUB_ENV"
      - name: Throwaway signing certificate, trusted on this runner only
        run: |
          cd "$RUNNER_TEMP"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=Developer ID Application: b-stack CI (TEST000000)\n[ext]\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\nbasicConstraints=critical,CA:false\n' > cert.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -config cert.cnf
          # macOS's openssl is LibreSSL, whose .p12 the keychain reads; OpenSSL 3 needs -legacy for that.
          openssl pkcs12 -export -legacy -inkey key.pem -in cert.pem -out cert.p12 -passout pass:ci 2>/dev/null \
            || openssl pkcs12 -export -inkey key.pem -in cert.pem -out cert.p12 -passout pass:ci
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
          echo "CSC_LINK=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=ci" >> "$GITHUB_ENV"
          # electron-builder skips signing in pull-request builds unless told; this certificate is a throwaway.
          echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"
      - name: Signed 0.1.1, the update the signed 0.1.0 app must take
        working-directory: starters/typescript/template
        env:
          BSTACK_UPDATE_URL: http://127.0.0.1:8765/
        run: |
          python3 scripts/package.py mac-arm64 --version 0.1.1 --no-journeys
          mkdir -p "$RUNNER_TEMP/update" && cp -R .build/package/out/update/. "$RUNNER_TEMP/update/"
      - name: Signed 0.1.0; codesign --verify; journeys against the signed app; smoke on its .dmg
        working-directory: starters/typescript/template
        env:
          BSTACK_UPDATE_URL: http://127.0.0.1:8765/
        run: |
          python3 scripts/package.py mac-arm64
          codesign -dv --verbose=2 .build/package/out/mac-arm64/starter.app 2>&1 | grep -E 'Authority|Runtime|flags'
      - name: Install the signed 0.1.0 .dmg; it finds, downloads and verifies the 0.1.1 update
        working-directory: starters/typescript/template
        run: |
          npm install --prefix "$RUNNER_TEMP/smoke" --no-save --ignore-scripts playwright-core@1.64.1
          python3 scripts/install_and_smoke.py .build/package/out/starter-0.1.0-mac-arm64.dmg "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/update-evidence" --update "$RUNNER_TEMP/update" 0.1.1 8765

  typescript-installers:
    # Each installer installed the way a user would, on its own system; Windows signatures checked by Windows; the x64
    # apps also find, download and verify the 0.1.1 update.
    needs: typescript
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, installer: starter-0.1.0-win-x64.exe, update: win-x64 }
          - { os: windows-11-arm, installer: starter-0.1.0-win-arm64.exe, update: "" }
          - { os: ubuntu-latest, installer: starter-0.1.0-linux-x64.AppImage, update: linux-x64 }
          - { os: ubuntu-24.04-arm, installer: starter-0.1.0-linux-arm64.AppImage, update: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: typescript-installers
          path: release
      - name: playwright-core at the starter's pinned version
        run: npm install --prefix "$RUNNER_TEMP/smoke" --no-save --ignore-scripts playwright-core@1.64.1
      - name: Trust the throwaway Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Certificate -FilePath release/win-ca.pem -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath release/win-cert.pem -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
      - name: Install, check, smoke test${{ matrix.update && ', update to 0.1.1' || '' }}
        run: |
          signed=""; [ "$RUNNER_OS" = "Windows" ] && signed="--signed"
          update=""; [ -n "${{ matrix.update }}" ] && update="--update release/update 0.1.1 8765"
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run --auto-servernum"; else run=""; fi
          $run python3 starters/typescript/template/scripts/install_and_smoke.py "release/${{ matrix.installer }}" "$RUNNER_TEMP/smoke" smoke-evidence $signed $update
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: installer-${{ matrix.os }}
          path: smoke-evidence/
          if-no-files-found: ignore
