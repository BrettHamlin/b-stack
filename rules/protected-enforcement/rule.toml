id = "protected-enforcement"
layer = "foundation"
summary = "Files that control enforcement can't change without a human code owner."
problem = "Agents can edit compiler flags, lint config, the dependency graph and CI. Weakening a check is often the cheapest way to pass it."
message = "This change modifies the enforcement surface. It needs code-owner review. If you changed it to make a check pass, revert and fix the underlying issue, or stop and report."
escape_hatches = ["Moving settings to an unlisted file: the settings check asserts effective settings.", "Editing the CI workflow in the same PR: CODEOWNERS on .github/ or required org workflows.", "TypeScript, Android and Rust: weakening a setting and arch/settings.json together, or editing scripts/settings.py (or build-logic, which reports Android's settings, or scripts/tools.py, which sets Rust's environment): all code-owned; review."]
origin = "Design discussion, Nov 2026."

[ios]
repo = "CODEOWNERS on Project.swift, Tuist.swift, Tuist/ (except the agent-edited Features.swift), tools.toml, .swiftlint.yml, Rules/, scripts/, .github/, AGENTS.md; branch protection."
tests_pending = "Repo-level checks (CODEOWNERS coverage of the enforcement files, compiler-settings assertion) not built yet."

[rust]
repo = "CODEOWNERS on Cargo.toml, rust-toolchain.toml, clippy.toml, deny.toml, .cargo/, tools.toml, arch/, scripts/, crates/app/tests/journeys.rs, crates/app/src/, feature-map/, .github/, .claude/, AGENTS.md; branch protection. GitHub ignores a rule whose owner doesn't exist, so the new-project skill replaces @OWNER."
settings = "scripts/settings.py (the settings gate) compares the settings in effect with arch/settings.json (Rust 1.99.0, cargo-deny 0.20.2): every workspace target's compiler arguments as cargo passes them, recorded by a RUSTC_WRAPPER during `cargo clippy --all-targets` in the dev and release profiles (the workspace lint levels, RUSTFLAGS' -D warnings, lint caps, cfgs, and each profile's overflow checks, debug assertions, optimization and panic strategy), per profile and kind (library, binary, tests); the Clippy driver, config folder and clippy.toml settings each crate gets; RUSTDOCFLAGS; cargo's merged file configuration (`cargo config get`: .cargo/config.toml here, in parent folders or in CARGO_HOME, so a test runner, [env], profile override or compiler wrapper there fails); deny.toml's settings (check.py passes it to cargo-deny with --config); the rustc, cargo, Clippy and cargo-deny versions; and that /CODEOWNERS is the only one, every rule names an owner and it lists every enforcement path. Settings from the environment (RUSTFLAGS, CARGO_ENCODED_RUSTFLAGS, CARGO_PROFILE_*, CARGO_BUILD_*, CARGO_TARGET_*, RUSTC_WRAPPER, CLIPPY_CONF_DIR, ...) never reach the gates: scripts/tools.py drops them."

[typescript]
repo = "CODEOWNERS on package.json, pnpm-workspace.yaml, pnpm-lock.yaml, tsconfig.base.json, tsconfig.effect.json, vite.config.ts, tools.toml, arch/, scripts/, .githooks/, apps/desktop/journeys/, apps/desktop/src/, apps/web/src/main.tsx, apps/desktop/vite.config.ts, apps/web/vite.config.ts, packages/fixtures/, feature-map/, .github/, .claude/, .agents/, AGENTS.md; branch protection. GitHub ignores a rule whose owner doesn't exist, so the new-project skill replaces @OWNER."
settings = "scripts/settings.py (the settings gate) compares the settings in effect with arch/settings.json: each package's compiler options as the compiler resolves them (tsc --showConfig), the Effect language service's diagnostics, vite.config.ts's lint and test settings as Node imports them (added lint rules may only be errors), pnpm-workspace.yaml's hoisting, install scripts and overrides, and that CODEOWNERS covers every enforcement path. Weakening one means changing arch/settings.json too, in the same reviewed change."

[android]
repo = "CODEOWNERS on settings.gradle.kts, build.gradle.kts, gradle.properties, gradle/ (catalog, verification metadata), build-logic/, tools.toml, arch/ (shape, detekt config and rules, Konsist tests), scripts/, core/src/commonMain/kotlin/core/UiId.kt, core-ui/, verify/journeykit/, verify/runner/, feature-map/, .github/, .claude/, .agents/, .githooks/, AGENTS.md; branch protection."
settings = "scripts/settings.py (the settings gate) compares the settings in effect with arch/settings.json: build-logic's bstackSettings task writes them after every script, property and init script has run (Gradle 9.9.2, Kotlin 2.4.21, AGP 9.5.2, detekt 2.0.0-alpha.6): Gradle's dependency verification mode, build cache, init scripts (GRADLE_USER_HOME's init.d too), offline mode and detekt's dry-run property (which skips every analysis); per module, as recorded for its role, every Kotlin compilation's warnings as errors, suppressed warnings, progressive mode, opt-ins, extra arguments, language and API version and JVM target, the Android SDK levels and Lint options, the shipped app's release shrinking, every detekt task's config, failure handling (ignoreFailures, failOnSeverity) and baseline, and every test task's failure handling and filters (filter patterns and includes/excludes); and that /CODEOWNERS is the only one, every rule names an owner and it lists every enforcement path. Modules have no build files, so the settings can only change in code-owned files; this catches a change from gradle.properties, settings.gradle.kts or an init script."
