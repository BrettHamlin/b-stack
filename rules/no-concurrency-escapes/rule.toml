id = "no-concurrency-escapes"
layer = "1+2"
summary = "Strict concurrency checking is on, and the escape hatches that silence it are banned."
problem = "Agents patch races with quick dispatches and delays, and silence the compiler with unchecked markers when it objects."
message = "Don't silence concurrency checking. Make the type an actor or confine it to the main actor. If neither fits, stop and report what you're trying to share."
escape_hatches = ["@unchecked Sendable, nonisolated(unsafe), @preconcurrency, Task.detached and DispatchQueue in features: banned by Harmonize rules.", "Hand-rolled locks: review."]
origin = "Lauren Tan talk (timer/scheduling workarounds). Design discussion, Nov 2026."

[ios]
compiler = "Swift 6 language mode; Settings and App isolated to MainActor by default (SWIFT_DEFAULT_ACTOR_ISOLATION)."
harmonize = "NoConcurrencyEscapes.swift: no @unchecked Sendable, no nonisolated(unsafe)."

[rust]
layer = "1"
compiler = "Send and Sync are checked by the compiler; the only way around them is unsafe code, and unsafe_code is forbid in the workspace lints, which no attribute in a crate can lower (Rust 1.99.0). The arch gate makes every crate inherit those lints."
message = "Don't silence the compiler's thread-safety checks: unsafe code is forbidden. Share through Arc, Mutex, channels or ownership. If none fits, stop and report what you're trying to share."
