id = "typed-ui-identifiers"
layer = "1+2"
summary = "UI identifiers used by the verification driver are compiler-checked constants, not string literals."
problem = "With loose strings, a typo or rename silently breaks verification, and agents invent new names instead of reusing existing ones."
message = "Use a constant from UIID instead of a string literal for accessibility identifiers. Add a new case if none fits."
escape_hatches = ["Inventing an identifier: UIID is its own type, not a String, so passing a string to JourneyKit's find(_:) is a compile error; and UIID's initializer is package-level, shared only by Core and the *Interface modules (SWIFT_PACKAGE_NAME), so creating one anywhere else in any safe spelling (UIID(...), .init(...), UIID.init, an extension factory, an ExpressibleByStringLiteral conformance, or through @testable import, since those modules are built without testability) is a compile error too. Reinterpreting memory (unsafeBitCast, withUnsafe*) is banned by name in journeys. Inside the wall, Harmonize keeps it closed: Core's UIID initializers must stay package, Core and *Interface may only create a UIID from a plain string literal (no forwarding factory), and UIID may not be extended or aliased outside Core.", "Raw XCUITest lookups in journeys: rejected by name outside JourneyKit.swift, using a closed list from XCUIAutomation's headers (every element-type query, descendants/children/matching/containing/element, XCUIApplication, XCUIElementQuery, NSPredicate, .identifier), as members, bare references (implicit self) or key-path components, and extending XCUIElement, XCUIElementQuery, XCUIApplication or XCUIElementTypeQueryProvider is rejected. Those names are therefore reserved in journey files, e.g. .element from enumerated(), a dictionary's .keys, Locale.current.identifier: destructure, rename or use a JourneyKit helper.", "Dynamic access (KVC such as value(forKey:), perform(Selector(...))) and tapping by coordinate (coordinate(withNormalizedOffset:)): not caught; review. dictionaryRepresentation is banned with the lookup names.", "JourneyKit itself: it holds the raw lookups and is code-owned (CODEOWNERS).", "Views: the identifier must be .rawValue of a <Feature>UIID constant, or .rawValue of a value passed in (a parameter or variable, trusted; review); literals, String(...), concatenation and String variables fail, in SwiftUI calls and UIKit assignments alike.", "Tests matching on visible text: JourneyKit's system-UI helpers take labels on purpose (system alerts, keyboard keys)."]
origin = "Design discussion on verification, Nov 2026."

[ios]
compiler = "UIID (Core) is a distinct type with a package-level initializer (Core and *Interface share a package name); <Feature>UIID constants live in the feature's Interface module and are shared by views (.rawValue) and journeys, which find elements only through JourneyKit's find(_ id: UIID): a String there does not compile."
harmonize = "TypedUIIdentifiers.swift, with SwiftSyntax (Harmonize 1.3.0 cannot see calls inside a SwiftUI body): in production code, .accessibilityIdentifier gets a UIID's .rawValue (call or UIKit assignment); UIID creation stays closed inside Core and *Interface; in Targets/*UITests outside JourneyKit.swift, no XCUITest lookup API, XCUI type, NSPredicate, memory reinterpretation or extension of XCUITest's element types, matched by name (backticks ignored), with no type or scope analysis."
