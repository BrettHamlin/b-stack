id = "typed-ui-identifiers"
layer = "1"
summary = "UI identifiers used by the verification driver are compiler-checked constants, not string literals."
problem = "With loose strings, a typo or rename silently breaks verification, and agents invent new names instead of reusing existing ones."
message = "Use a constant from UIID instead of a string literal for accessibility identifiers. Add a new case if none fits."
escape_hatches = ["String literals: Harmonize rule, parsed with SwiftSyntax: a literal (also in parentheses or String(...)) used as a subscript, an identifier: argument, an identifier comparison, or an identifier NSPredicate value (quoted, positional, argumentArray or %K) is rejected unless the subscripted value is a dictionary in scope (typed, literal, [K: V](), Dictionary<K, V>(), cast, parameter, or a copy of one; launchEnvironment, userInfo, environment).", "System UI that cannot carry our identifiers is allowed: queries under keyboards, and XCUIApplication(bundleIdentifier: \"com.apple.springboard\").", "A literal bound to a local constant first (let id = \"...\"; app.switches[id]): not caught; review.", "Tests matching on visible text: driver convention and review."]
origin = "Design discussion on verification, Nov 2026."

[ios]
compiler = "UIID enums live in the feature's Interface module, imported by both the view and the UI journeys."
harmonize = "TypedUIIdentifiers.swift: no string literals passed to .accessibilityIdentifier (text match: Harmonize 1.3.0 cannot see calls inside a SwiftUI body); in Targets/*UITests, a SwiftSyntax visitor with scope tracking rejects literal element lookups as listed in escape_hatches."
