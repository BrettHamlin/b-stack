id = "typed-ui-identifiers"
layer = "1"
summary = "UI identifiers used by the verification driver are compiler-checked constants, not string literals."
problem = "With loose strings, a typo or rename silently breaks verification, and agents invent new names instead of reusing existing ones."
message = "Use a constant from UIID instead of a string literal for accessibility identifiers. Add a new case if none fits."
escape_hatches = ["String literals: Harmonize rule, deny by default: any string-literal subscript is rejected unless what's subscripted is a known dictionary, including behind nested comments, in a typed or stored query, or on a helper's result.", "A helper's dictionary result subscripted directly (helper()[\"k\"]) is rejected too: bind it to a typed dictionary first.", "A literal bound to a local constant first (let id = \"...\"; app.switches[id]): not caught; review.", "Tests matching on visible text: driver convention and review."]
origin = "Design discussion on verification, Nov 2026."

[ios]
compiler = "UIID enums live in the feature's Interface module, imported by both the view and the UI journeys."
harmonize = "TypedUIIdentifiers.swift: no string literals passed to .accessibilityIdentifier, and in Targets/*UITests, with comments removed (nested too; strings kept), no string-literal subscript unless the receiver is a known dictionary (launchEnvironment, userInfo, or a variable typed as, initialised with or copied from a dictionary), no string-literal identifier argument, and no identifier compared with a literal (Swift, or NSPredicate as a quoted value or a format argument). Typed predicates pass. Text matches: Harmonize 1.3.0 can't see calls inside a SwiftUI body."
