id = "typed-ui-identifiers"
layer = "1+2"
summary = "Views share typed identifiers with journey bodies that cannot import XCUITest."
problem = "String lookups compile after identifiers change; linting every spelling of XCUITest lookup APIs leaves escapes."
message = "Use a <Feature>UIID constant in its Interface module. Journey bodies belong in AppVerifyJourneys and use JourneyKit's typed find(_:). Add a JourneyKit helper if needed; stop and report rather than bypassing the boundary."
escape_hatches = ["A String passed to find(_:): compiler error. A raw app, query, key path or module selector: the journey framework has no XCTest/XCUIAutomation search paths; raw types are out of scope and Element exposes no queries.", "Importing XCTest/XCUIAutomation in a journey body: compiler error, including with deprecated declarations; no shadow overloads are used.", "Casting an Element to AnyObject: does not expose the SDK's selectors; compiler rejects .buttons. Reflection, runtime class lookup and Objective-C dispatch can recover private objects: the remaining journey Harmonize rule bans those dynamic access names.", "Handwritten code in AppVerifyUITests can import XCTest because XCTestCase requires it: verify rejects any drift from the generated adapters, including extra files. JourneyKit and the generator are code-owned.", "Creating UIIDs outside Core and Interface modules: compiler error; only they share SWIFT_PACKAGE_NAME, the initializer is package-level, and those modules disable testability. Harmonize keeps the wall closed inside Core and Interface modules (package initializers, literal-only construction, no external UIID extensions/aliases).", "Views: the identifier must be .rawValue of a <Feature>UIID constant (or of one indexed with .at(...), which appends integers only), .rawValue of a value reached from a variable, parameter or self (through ?, ! and subscripts too; trusted; review), a ?? chain or a ternary (chained too) between such values; literals, String(...), concatenation, String variables and type-rooted values that aren't a ...UIID fail, in SwiftUI calls and UIKit assignments (with or without self.) alike.", "Deliberate evasion is review's job, not the gate's: lookalike members added by extension to a UIID-rooted chain (a property, or a method named at, returning another type with a rawValue), forging a UIID inside the code-owned Core or *Interface modules (initializer references, metatypes, type(of:), extra initializers in Core extensions), stored references to .accessibilityIdentifier(_:), key-path writes, and raw-pointer reinterpretation. A follow-up turns identifiers into String-backed enums, which closes the forging paths by language rules.", "System-UI helpers accept labels deliberately: permission alerts and keyboard keys have no app identifiers. Raw SDK objects never leave JourneyKit.", "TypeScript: forging a UiId inside contracts, or with Brand.nominal<UiId>() elsewhere: review (contracts is code-owned; the lint rule bans only the uiId constructor by name).", "TypeScript: journey helpers in journeys/support may use Playwright: they are code-owned, and expose only the typed Screen."]
origin = "Design discussion and read-only enforcement audit, Nov 2026."

[ios]
compiler = "UIID (Core) is a distinct type with a package initializer shared only by Core and Interface modules, both built without testability. JourneyKit compiles with library evolution and an internal XCTest import, exposing Screen and Element instead of SDK objects. AppVerifyJourneys has ENABLE_TESTING_SEARCH_PATHS=NO: XCTest and XCUIAutomation imports fail, raw SDK types are out of scope, private handles cannot be read, and find(_:) rejects Strings."
harmonize = "TypedUIIdentifiers.swift: UIID .rawValue expressions in views and UIKit; Core/Interface identifier declaration restrictions; only reflection/Objective-C dynamic access remains checked by name in journey bodies."
verify = "scripts/verify.py checks the AppVerifyUITests source directory against generated XCTestCase adapters, keeping arbitrary code out of the SDK-capable runner target."

[typescript]
compiler = "UiId (packages/contracts/src/ui.ts) is a branded string made only by uiId, which contracts doesn't export: a view or journey can't make one, and the journeys' Screen (apps/desktop/journeys/support/app.ts) takes only UiIds, so a raw string fails to compile (TypeScript 7.0.2 (effect-tsgo 0.67.1))."
lint = "bstack/typed-ui-identifiers: data-testid in the renderer is set only from a contracts identifier object (`TallyUi.add`); journey bodies (*.journey.ts) can't import playwright-core or electron, so the Screen is their only way to the app (oxlint 1.89.0 with oxlint-tsgolint 7.0.2004 (vite-plus 1.4.0))."
message = "Use a typed identifier from contracts (e.g. TallyUi.add): views set data-testid only to one, and journeys use the Screen in journeys/support, never text, roles or selectors. Add the identifier to the screen's *Ui object in packages/contracts; if the Screen lacks what you need, stop and report."
