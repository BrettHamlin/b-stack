id = "typed-ui-identifiers"
layer = "1"
summary = "UI identifiers used by the verification driver are compiler-checked constants, not string literals."
problem = "With loose strings, a typo or rename silently breaks verification, and agents invent new names instead of reusing existing ones."
message = "Use a constant from UIID instead of a string literal for accessibility identifiers. Add a new case if none fits."
escape_hatches = ["Inventing an identifier: UIID is its own type, not a String, so passing a string to JourneyKit's find(_:) is a compile error, and creating a UIID outside a *Interface module fails the Harmonize rule.", "Raw XCUITest lookups in journeys: rejected by name outside JourneyKit.swift, using a closed list from XCUIAutomation's headers (every element-type query, descendants/children/matching/containing/element, XCUIApplication, XCUIElementQuery, NSPredicate, .identifier), including in key paths. Those names are therefore reserved in journey files, e.g. a dictionary's .keys: rename or use a helper.", "Dynamic access (KVC such as value(forKey:), perform(Selector(...))): not caught; review.", "JourneyKit itself: it holds the raw lookups and is code-owned (CODEOWNERS).", "Tests matching on visible text: JourneyKit's system-UI helpers take labels on purpose (system alerts, keyboard keys)."]
origin = "Design discussion on verification, Nov 2026."

[ios]
compiler = "UIID (Core) is a distinct type; <Feature>UIID constants live in the feature's Interface module and are shared by views (.rawValue) and journeys, which find elements only through JourneyKit's find(_ id: UIID): a String there does not compile."
harmonize = "TypedUIIdentifiers.swift: no string literals passed to .accessibilityIdentifier (text match: Harmonize 1.3.0 cannot see calls inside a SwiftUI body); in Targets/*UITests outside JourneyKit.swift, a SwiftSyntax visitor rejects the XCUITest lookup API by name; anywhere outside Targets/*Interface, UIID(...) is rejected."
