id = "typed-ui-identifiers"
layer = "1"
summary = "UI identifiers used by the verification driver are compiler-checked constants, not string literals."
problem = "With loose strings, a typo or rename silently breaks verification, and agents invent new names instead of reusing existing ones."
message = "Use a constant from UIID instead of a string literal for accessibility identifiers. Add a new case if none fits."
escape_hatches = ["String literals: Harmonize rule, also when hidden behind a comment or in a stored query.", "A literal bound to a local constant first (let id = \"...\"; app.switches[id]): not caught; review.", "Tests matching on visible text: driver convention and review."]
origin = "Design discussion on verification, Nov 2026."

[ios]
compiler = "UIID enums live in the feature's Interface module, imported by both the view and the UI journeys."
harmonize = "TypedUIIdentifiers.swift: no string literals passed to .accessibilityIdentifier, and in Targets/*UITests, with comments removed, no string literal as the subscript of an element query (including a variable holding one), as an identifier argument, or compared with an identifier (Swift or NSPredicate). Ordinary dictionaries and typed predicates pass. Text matches: Harmonize 1.3.0 can't see calls inside a SwiftUI body."
