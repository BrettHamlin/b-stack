# Making UIID ExpressibleByStringLiteral in the journey module would undo the typed check; the package-level initializer stops it.
# Outside the package the `package init` isn't a candidate at all, so Swift 6.4.2 (Xcode 27.2) reports no matching initializer
# on the conformance's `self.init(value)`, not an access error.
expect = "fail"
enforced_by = "compiler"
uses_example = false
case_feature = true
diagnostic = "LiteralIDJourneys.swift:7:14: error: no exact matches in call to initializer"
