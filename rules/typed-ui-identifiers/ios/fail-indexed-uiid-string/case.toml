# Indexing takes integers only: a String can't be smuggled into an identifier through at(_:).
# Swift 6.4.2, Xcode 27.2.
expect = "fail"
enforced_by = "compiler"
uses_example = "Targets/AppVerifyJourneys/IndexedJourneys.swift uses SettingsInterface"
diagnostic = "cannot convert value of type 'String' to expected argument type 'Int'"
