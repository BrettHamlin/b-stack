id = "verified-features"
layer = "3"
summary = "Every feature has a feature-map entry, and every journey it names passes in the running app."
problem = "Unit tests prove logic, not the app: a view that isn't wired up, or a save that never reaches storage, passes them. Agents also call work done without ever running it."
message = "Every feature needs feature-map/<id>.toml naming XCUITest journeys in Targets/AppVerifyUITests, and every journey must pass (python3 scripts/verify.py). If a journey fails, fix the app or record why; never weaken the journey."
escape_hatches = ["Loosening a journey's assertions, or deleting a journey with its map entry: not caught by a gate. CODEOWNERS covers feature-map/ and Targets/AppVerify*, so it needs code-owner review once branch protection is on (not built yet; protected-enforcement).", "A journey not in the map, including one inherited from a base class: rejected by the map check and again from the run's results.", "A journey with no screenshots: rejected; screenshots are the evidence.", "Skipping the gate: check.py runs it by default; CI and branch protection are not built yet."]
origin = "Lauren Tan's talk (runtime verification, feature map, driver CLI) and pstack's create-verification-skill; enforced as a gate here."

[ios]
verify = "scripts/verify.py: map check (each Targets/<Feature>Interface has an entry; journeys named and present both ways, including inherited tests), then the AppVerify scheme's XCUITest journeys on a simulator. Fails if a journey fails, a result isn't in the map, or a journey attaches no screenshot."
