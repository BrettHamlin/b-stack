id = "verified-features"
layer = "3"
summary = "Every feature has a feature-map entry, and every journey it names passes in the running app."
problem = "Unit tests prove logic, not the app: a view that isn't wired up, or a save that never reaches storage, passes them. Agents also call work done without ever running it."
message = "Every feature needs feature-map/<id>.toml naming journeys in Targets/AppVerifyJourneys with generated XCTestCase adapters in AppVerifyUITests, and every journey must pass (python3 scripts/verify.py). If a journey fails, fix the app or record why; never weaken the journey."
escape_hatches = ["Loosening a journey's assertions, or deleting a journey with its map entry: not caught by a gate. CODEOWNERS covers feature-map/ and Targets/AppVerify*, so it needs code-owner review once branch protection is on (not built yet; protected-enforcement).", "A journey not in the map, including inherited body methods: rejected by the map check and runtime results. Handwritten runner code (including XCTestCase aliases) is rejected by the generated-adapter check before running.", "A map entry that doesn't hold: an unknown fixture, a module that isn't a feature, a journey named by two features, a journey that never runs, or a journey whose launches (recorded by its launch helper) aren't exactly the map's one fixture: all rejected.", "A journey that records a fixture it didn't launch (adding a fixture-<name> attachment by hand): not caught; journeys are code-owned (CODEOWNERS) and must launch through the helper.", "The shipped App's one App-specific line (which preferences object it passes) is never run by a journey; both apps share the rest of the composition (NotificationSettings.store(preferences:) and NotificationSettingsView(store:)), thin-app keeps App to composition, and review covers that line.", "A journey with no screenshots: rejected; screenshots are the evidence.", "Skipping the gate: check.py runs it by default; CI and branch protection are not built yet."]
origin = "Lauren Tan's talk (runtime verification, feature map, driver CLI) and pstack's create-verification-skill; enforced as a gate here."

[ios]
verify = "scripts/verify.py: map check (each Targets/<Feature>Interface has an entry, each entry's module is a feature, each journey is named once with a known fixture, every journey in code is mapped; XCTestCase adapters exactly match the discovered bodies and no extra runner files exist), then the AppVerify scheme's XCUITest journeys on a simulator. Fails if a mapped journey fails or doesn't run, a result isn't in the map, a journey attaches no screenshot, or it launched a fixture other than the map's."

[rust]
verify = "scripts/verify.py: map check (each crates/features/<name> crate is in exactly one feature-map entry's modules, every module named is a feature crate, every entry has journeys, each with what it proves, and no journey is named twice), then the journeys: the #[test] functions in crates/app/tests/journeys.rs, which run the built app binary. Fails if a journey there isn't mapped, a mapped one isn't there, or one doesn't pass. Each journey's output is the evidence, in .build/evidence/latest/evidence.md."
message = "Every feature crate needs a feature-map/<id>.toml entry naming journeys in crates/app/tests/journeys.rs, which run the built app, and every journey must pass (python3 scripts/verify.py). If a journey fails, fix the app or record why; never weaken the journey."

[typescript]
verify = "scripts/verify.py: map check (each packages/features/<name> package is in exactly one feature-map entry's modules, every module named is a feature package, every entry has journeys, each with what it proves, and no journey is named twice), then builds the renderer and desktop app and runs the journeys: the top-level tests in apps/desktop/journeys/*.journey.ts, which launch the built Electron app through Playwright. Fails if a journey there isn't mapped, a mapped one isn't there, one doesn't pass, or one saves no screenshot. Evidence: .build/evidence/latest/evidence.md and the screenshots."
message = "Every feature package needs a feature-map/<id>.toml entry naming journeys in apps/desktop/journeys/, which run the built app, and every journey must pass and save screenshots (python3 scripts/verify.py). If a journey fails, fix the app or record why; never weaken the journey."
