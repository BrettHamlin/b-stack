id = "no-io-in-logic"
layer = "2"
summary = "Feature logic modules (*Logic) do no I/O; side effects go through injected clients."
problem = "Neither TCA nor Mobius stops a reducer or update function from reading files or calling the network, so logic becomes untestable and effects escape cancellation."
message = "No I/O in a Logic module. Define a client protocol in the feature's Interface module, inject it, and call it from an effect."
escape_hatches = ["Wrapping the API in a local helper inside the Logic module: the text match still sees the API name.", "Unlisted I/O APIs: add them to NoIOInLogic.swift when found."]
origin = "State-flow trial, Nov 2026: probe 6 (logic does I/O directly) was caught by neither TCA nor Mobius."

[ios]
harmonize = "NoIOInLogic.swift: text match for FileManager, FileHandle, URLSession, UserDefaults, contentsOf:, NWConnection and Process( in Targets/*Logic/ (a heuristic, not type-aware)."

[rust]
layer = "1+2"
compiler = "Core and feature crates are #![no_std]: std (files, network, clocks, threads, processes) doesn't exist there, so any use is an unresolved name (Rust 1.99.0)."
arch = "arch/checker: a no_std role's src/lib.rs must start with #![no_std], and `extern crate std` is banned in it."
message = "No I/O in core or feature crates: they're no_std. Define a trait for what you need in the feature crate, implement it in a platform crate, and pass it in from the app crate."
