id = "typed-identifiers"
layer = "1"
summary = "IDs, units and validated values are distinct types, not raw primitives."
problem = "Raw String/Int IDs and units get mixed up (a message ID passed as a user ID, ms as seconds). The compiler can't tell them apart."
message = "Use the distinct type (e.g. UserID), not a raw String. If no type exists for this value yet, add one in Domain."
escape_hatches = ["Re-wrapping raw values freely: keep validating initializers private, expose a failable parse instead."]
origin = "Design discussion, Nov 2026."

[ios]
compiler = "One struct per ID or unit (struct UserID: Hashable, Sendable). Validated types have a private init and a failable parse."

[rust]
compiler = "One newtype per ID or unit (struct PlayerId(u32)); validated types keep the field private and expose a parse returning Option or Result. Passing a raw number where the newtype is expected is a type error (Rust 1.99.0)."

[typescript]
layer = "1+2"
compiler = "One Effect Schema brand per ID or unit, in packages/contracts (Schema.String.pipe(Schema.brand(\"PlayerId\"))). Passing a raw string where the brand is expected is a type error (TypeScript 7.0.2 (effect-tsgo 0.67.1)). Forging one with `as` is a lint error (no-force-operations)."
lint = "bstack/typed-identifiers: outside packages/contracts, no runtime import of effect/Brand and no Schema.brand, so only contracts mints a branded type and its values come from decoding its schema (oxlint 1.89.0 with oxlint-tsgolint 7.0.2004 (vite-plus 1.4.0))."
