id = "exhaustive-tests"
layer = "2"
summary = "TCA tests stay exhaustive: no exhaustivity = .off, skipReceivedActions or skipInFlightEffects."
problem = "Exhaustive TestStore tests are why TCA caught untested changes and deleted assertions in the trial. Agents switch exhaustivity off when a test is hard to finish."
message = "Keep the TestStore exhaustive. Assert every state change and received action; let effects finish or cancel them. If that's impossible, stop and report."
escape_hatches = ["Testing reducers by hand without a TestStore: review.", "TypeScript: comparing a field instead of the whole value (`expect(x.a).toBe(1)`): review.", "Android: comparing a field or a tuple of fields instead of the whole value (`assertEquals(9, setup.columns)`, `Triple(a.x, a.y, a.z)`), or a projection made by a helper function (`mix(side)` that filters): review."]
origin = "State-flow trial, Nov 2026: TCA's exhaustive TestStore caught probes 3 and 8."

[ios]
harmonize = "ExhaustiveTests.swift: text match in test code for exhaustivity = .off, .skipReceivedActions( and .skipInFlightEffects(."

[typescript]
lint = "Tests assert whole values: vitest/no-restricted-matchers bans toMatchObject, toHaveProperty, toBeTruthy, toBeFalsy, toBeDefined, toContain, toContainEqual and toMatch; eslint/no-restricted-properties bans expect.objectContaining, arrayContaining, stringContaining, stringMatching, any and anything; vitest/expect-expect fails a test with no assertion (oxlint 1.89.0 with oxlint-tsgolint 7.0.2004 (vite-plus 1.4.0)). The TypeScript form of the rule: there's no TestStore to keep exhaustive, so each assertion is."
message = "Assert the whole value (toEqual, toBe, toStrictEqual, toBeInstanceOf), so a change the test didn't expect fails it. If the whole value can't be pinned down, stop and report."

[android]
konsist = "ArchitectureTest.exhaustiveTests (Konsist 0.18.1): Turbine's test {} fails on states it didn't consume, the TestStore property; tests may not cancelAndIgnoreRemainingEvents, cancelAndConsumeRemainingEvents, skipItems, expectMostRecentItem, testIn or turbineScope, every awaitItem() is the whole actual value of an assertEquals (not a field of it), a logic model exposes its state as `val state: StateFlow` and logic tests read it only through state.test (not .value, .first(), collect, or a scope function or `with` on it), partial assertions (assertTrue, assertFalse, assertNotNull, assertContains, assertNotEquals) are banned, an assertEquals's actual value (the one named `actual =`, else the second argument) is never a projection at its top level (`.size`, `.length`, `.count`, `isEmpty`, `isNotEmpty`, `isNullOrEmpty`, `contains*`, `any`, `all`, `none`, `filter*`, `map*`, `flatMap*`, `groupBy`, `groupingBy`, `eachCount`, `associate*`, `sumOf` or `partition` in its call chain, outside lambdas and arguments), every @Test function asserts something (everyTestAsserts), and a logic test sends a model no action before subscribing to its state (`model.send(...)` before `model.state.test { }` in the same test, testsSubscribeBeforeSending: Turbine starts from the state when it subscribes, so the states those actions made would go unasserted; start from a later state through the constructor, a fixture or saved values) (text matches; actions sent through a helper function aren't seen)."
message = "Assert every state: inside state.test { }, write assertEquals(<whole state>, awaitItem()) for each one the model emits, and assert whole values elsewhere. If that's impossible, stop and report."
