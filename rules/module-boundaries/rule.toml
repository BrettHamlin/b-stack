id = "module-boundaries"
layer = "1+2"
summary = "Modules depend and import only in the directions the module shape allows; features and their links are declared in Features.swift, inside the shape."
problem = "Agents import whatever makes the code compile: UI reaching into persistence, domain importing UI frameworks. After a few times it looks like the convention."
message = "This import isn't allowed. If the module shape allows the link, declare it in Tuist/ProjectDescriptionHelpers/Features.swift (the message names the line). Otherwise move the code to a module that may use it, or pass data in through Core or an Interface module. Never edit Project.swift, ModuleShape.swift or Rules/; if a link outside the shape seems necessary, stop and report."
escape_hatches = ["Hand-editing a target or dependency into Project.swift: the project-graph check compares Tuist's dump with what the shape gives Features.swift.", "Writing a link outside the shape in Features.swift: it can only name FeatureLink and SharedLink cases, each inside the shape; ModuleShape.swift is protected.", "Declaring a feature without its module folders, or adding a folder that isn't a declared module: Harmonize compares Targets/ with the declaration.", "A subfolder named *Tests or *Fixtures inside a shipped module, so Harmonize's productionCode() rules skip its code: rejected (noSkippedSubfolders).", "Adding a dependency in Package.swift: manifest is protected; graph check fails.", "Importing a module reachable indirectly: Tuist inspect. Importing a disallowed system framework: Harmonize allowlist.", "Making internals public to cross a boundary: review.", "TypeScript: importing a package the importer doesn't declare, or another package's files by path: compiler error (pnpm hoist = false, rootDir per package). A tool installed at the workspace root: lint (bstack/module-boundaries)."]
origin = "Lauren Tan talk (Dune: electron-main/renderer import bans). Swift 6.4.2 testing, Nov 2026: compiler blocks undeclared sibling imports on clean builds only; misses indirect imports and system frameworks. Hexfleet trial (2026-11-21, F5): a feature needing links inside the shape had to wait for the owner; owner decided such links no longer need approval."

[ios]
compiler = "One Tuist framework target per module (Core, <Feature>Interface, <Feature>, Platform, App); InternalImportsByDefault and MemberImportVisibility."
tuist = "Project.swift builds every target from Tuist/ProjectDescriptionHelpers/ModuleShape.swift (protected) and Features.swift (agent-edited). tuist inspect dependencies --only implicit: every import of a project module must be a declared dependency. Catches undeclared siblings and modules reachable only indirectly, which the compiler misses."
harmonize = "ModuleBoundaries.swift compiles the same shape and declaration (Rules/Sources/ModuleShape links to them): each module imports only its declared links and the system frameworks its role allows (e.g. Core may not import SwiftUI), which Tuist doesn't check; imports outside the shape and links the shape allows but Features.swift doesn't declare get different messages; `tuist dump project` must match the derived targets and dependencies exactly; every declared feature has its folders and every Targets/ folder is a declared module; no folder inside a shipped module is named *Tests or *Fixtures, which Harmonize's productionCode() would skip."

[rust]
compiler = "One crate per module in a Cargo workspace (Cargo.toml members are the shape's folders). A crate can only name crates it declares as dependencies: anything else is an unresolved import (Rust 1.99.0)."
arch = "scripts/arch.py checks `cargo metadata` against arch/shape.toml (protected): every crate folder under crates/ is a member in a role's folder; each path dependency is on a workspace crate whose role this crate's role may use (core: none; feature: core; platform: core, feature; app: all); only the app crate has a binary. Messages differ for a crate outside the shape and a link the shape doesn't allow."
message = "This dependency isn't allowed. A crate's role comes from its folder (arch/shape.toml): features use core; platform crates use core and features; the app uses everything. Pass what you need in through a trait in a crate this one may use. Never edit Cargo.toml's members or arch/shape.toml; if a link outside the shape seems necessary, stop and report."

[typescript]
compiler = "One pnpm package per module; each package sees only the packages it declares (hoist = false), so importing an undeclared package fails (TS2307), each tsconfig's rootDir is its own folder, so a relative import into another package fails (TS6059), and a package's `exports` map hides its other files. The renderer (apps/web) has no Node.js or Electron types: importing either fails (TypeScript 7.0.2 (effect-tsgo 0.67.1))."
arch = "scripts/arch.py: every package is in a role's folder (arch/shape.json); pnpm-workspace.yaml lists exactly those folders; a workspace dependency must be one the role's may_use allows (the renderer can't use the desktop app, features can't use platform packages, contracts use nothing); exports stay in ./src/."
lint = "bstack/module-boundaries (arch/lint): an import must be a declared dependency of its package (catches the root's tools, which a walk up from any package can resolve), and imports name modules by string literal; bstack/no-io-globals: the renderer reaches the outside world only through the preload's bridge (no fetch, storage, sockets, workers or globalThis) (oxlint 1.89.0 with oxlint-tsgolint 7.0.2004 (vite-plus 1.4.0))."

[android]
compiler = "One Gradle module per module, each depending only through `implementation`: a module sees only what its module.toml declares, so an import of anything else is `Unresolved reference` (Kotlin 2.4.21, AGP 9.5.2). Modules have no build files: build-logic's convention plugin (protected) gives each its role's settings from its folder (arch/shape.json) and reads its module.toml (`uses`), failing the build when a link isn't one the role may use, including another feature's modules for a feature's own (`(own)`). Common modules (core, a feature's api and logic, the journeys) can't name Android at all."
konsist = "ArchitectureTest.moduleBoundaries, uiReachesNoContext and uiImportsOnlyTheModelsTypes (Konsist 0.18.1): a feature's ui module imports nothing from java., javax. or android. and doesn't use LocalContext, and imports from its logic only the model, its state and action types (top-level classes and interfaces named `...Model`, `...State`, `...Action`, in any package of the logic module) and the logic's classes and interfaces those state and action types declare (constructor parameter, property and nested types, transitively; a type used only inside a getter or function body doesn't count), or a nested type of one: no top-level function, property or object, and no companion or other member, so what the view needs worked out (what's reachable, allowed or done) is on the state, where the logic's tests see it (text matches; a fully qualified name without an import isn't seen, and a view deciding things from the state's fields itself is review). ArchitectureTest.stateIsData: those state and action types (not the model) declare no functions but overrides, members, nested or in a companion, so the view can't call logic through them either: what the screen needs is a value or a property without parameters on the state, and the model's helpers are top-level functions in logic."
arch = "scripts/arch.py: every folder is a module of a role in arch/shape.json or one of the project's own; each features/<name> is exactly api, logic and ui; modules hold only module.toml and their role's source sets (common: commonMain, commonTest; Android: main, test), and only the two apps have an AndroidManifest.xml (a library's permissions or exported components would merge into the shipped app unread), so no build files, other source sets (src/debug, src/androidTest, jvmMain) or Java files."
message = "This link isn't allowed. A module's role comes from its folder (arch/shape.json): a feature's logic uses its api and core; its ui uses its logic, api, core and core-ui; platform modules use core and feature apis; the apps use everything but each other. Declare a link the role allows in the module's module.toml. Never add build files or edit arch/shape.json or build-logic/; if a link outside the shape seems necessary, stop and report."
