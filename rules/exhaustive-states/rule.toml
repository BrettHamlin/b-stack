id = "exhaustive-states"
layer = "1"
summary = "State is a sum type matched without a catch-all default, so new states break every unhandled site."
problem = "State spread across flags and optionals allows impossible combinations, and agents miss sites when a new state is added."
message = "Handle every case explicitly. A catch-all default hides new states from the compiler."
escape_hatches = ["`default:` on project-owned enums: banned by Harmonize.", "Falling back to Bool flags: review."]
origin = "Design discussion, Nov 2026."

[ios]
compiler = "Enums with associated values; switch must be exhaustive."
harmonize = "ExhaustiveStates.swift: a switch whose cases are all enum-case patterns may not have a default (SwiftSyntax visitor; a heuristic without type information)."
