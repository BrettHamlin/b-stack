# Fixtures declared as an App dependency in the protected Project.swift but never imported: linked into the shipped
# app without an import for the Harmonize rule to see.
expect = "fail"
enforced_by = "tuist"
uses_example = false
diagnostic = "App redundantly depends on: Fixtures"

[[edits]]
file = "Project.swift"
find = "let targets: [Target] = modules(features, shared: sharedLinks).map(target)"
replace = """let targets: [Target] = modules(features, shared: sharedLinks).map(target).map { target in
    var target = target
    if target.name == "App" { target.dependencies.append(.target(name: "Fixtures")) }
    return target
}"""
