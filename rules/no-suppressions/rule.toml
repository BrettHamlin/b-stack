id = "no-suppressions"
layer = "2"
summary = "No lint or compiler suppression comments outside a protected allowlist."
problem = "The quickest way past any lint rule is a suppression comment, and agents use them freely under pressure to finish."
message = "Suppression comments aren't allowed. Fix the underlying issue. If the rule is wrong here, stop and report; a human adds allowlist exceptions."
escape_hatches = ["Disabling the rule in config: config is protected.", "Moving code into an allowlisted file: allowlist changes need a code owner."]
origin = "Design discussion, Nov 2026."

[ios]
swiftlint = "Custom rule no_suppressions matches swiftlint:disable/enable in comments, including comments that try to disable the ban itself."

[rust]
arch = "arch/checker: no #[allow], #[expect] or #[warn] (or the same inside cfg_attr) anywhere; every crate's [lints] is exactly `workspace = true`; no build scripts or proc-macro crates; no macro_rules!, include! or #[path], which hide code from the parse. Clippy's allow_attributes is also on."
message = "Lint attributes aren't allowed, and lint levels live only in the protected Cargo.toml and clippy.toml. Fix the underlying issue. If the rule is wrong here, stop and report."
