id = "tests-always-run"
layer = "2"
summary = "Every test target runs in the tests gate; a new feature's tests can't be silently left out."
problem = "The tests gate ran one hard-coded scheme (SettingsTests), so a new feature's tests never ran and the gate still passed."
message = "Each Targets/<Feature>Tests folder becomes a .unitTests target when its feature is declared in Tuist/ProjectDescriptionHelpers/Features.swift; the UnitTests scheme runs every unit-test target. If that's not possible, stop and report."
escape_hatches = ["A test folder not named *Tests: review. The feature shape names it <Feature>Tests.", "Removing the UnitTests scheme's filter or the check in scripts/check.py: both files are code-owned (protected-enforcement)."]
origin = "Nov 2026: found by reading check.py before a new app replaced the Settings example; also on the enforcement audit's list."

[ios]
tests = "Project.swift builds the UnitTests scheme from every .unitTests target; check.py's tests gate runs it, after failing if any Targets/*Tests folder isn't run by a scheme's test action."

[rust]
tests = "check.py's tests gate runs cargo test --workspace --all-targets, then the doc tests, so a new crate's tests run without being listed anywhere."
arch = "No #[ignore] (or cfg_attr(..., ignore)); no test = false or doctest = false on a target, harness = false, or autotests/autobins/autoexamples/autobenches/autolib = false."
message = "Every test runs: never skip one or turn a target's tests off. If a test can't pass, fix the code or the test, or stop and report."

[typescript]
tests = "check.py's tests gate runs vp test's unit project, whose include is every package's tests/**/*.test.ts(x): a new package's tests run without being listed anywhere. Vitest runs with allowOnly = false and retry = 0 (T3 Code's setting)."
lint = "bstack/no-skipped-tests: no .skip, .only, .todo, .skipIf, .runIf or .fails (oxlint 1.89.0 with oxlint-tsgolint 7.0.2004 (vite-plus 1.4.0))."
arch = "scripts/arch.py: files in tests/ are *.test.ts(x) or helpers in tests/support/; packages have no scripts."
message = "Every test runs: never skip one or turn a package's tests off. If a test can't pass, fix the code or the test, or stop and report."

[android]
tests = "check.py's tests gate runs every module's tests by task (jvmTest, testDebugUnitTest), so a new module's tests run without being listed anywhere, then reads the JUnit results: a module with test sources and no results, or a skipped test, fails."
konsist = "ArchitectureTest.testsAlwaysRun and everyTestAsserts (Konsist 0.18.1): no @Ignore, @Disabled or assumptions in tests, and every feature's logic module has tests."
arch = "scripts/arch.py: tests live only in commonTest and src/test, which the gate runs; src/androidTest and other test source sets fail (they'd never run)."
message = "Every test runs: never skip one or put it where the gate doesn't run it. If a test can't pass, fix the code or the test, or stop and report."
