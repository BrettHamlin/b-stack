# One feature-map entry. Draft format; to be refined in the verification discussion.
# A feature map says what the user can do, how they reach it, and what proves it worked.

id: notification-preferences
summary: User turns a notification category on or off
entry_points:
  - Settings > Notifications
preconditions:
  - app launched in fixture mode, signed in as fixture account A
actions:
  - turn off the "Mentions" category
  - leave Settings and reopen it
  - relaunch the app
expected:
  - "Mentions" stays off after relaunch
  - other categories are unchanged
evidence:
  - screenshots before and after relaunch
  - saved preference read from storage or the backend
failure_cases:
  - storage write fails: the UI shows an error and doesn't claim success
ui_ids:  # constants from the shared UIID enum
  - UIID.Settings.notifications
  - UIID.Notifications.mentionsToggle
